services:

  mysql:
    image: mysql:8.0
    container_name: flaskcrud_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: postgres
      MYSQL_DATABASE: flaskcrud

    ports:
      - "3308:3306"

    volumes:
      - ./sql/db.sql:/docker-entrypoint-initdb.d/db.sql
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  flask:
    build: .
    container_name: flaskcrud_app

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "5001:5000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: postgres
      MYSQL_DB: flaskcrud
      MYSQL_PORT: 3306

    volumes:
      - ./app:/app/app

    restart: always

volumes:
  mysql_data: